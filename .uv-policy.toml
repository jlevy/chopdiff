# Mirrors `[tool.uv]` in pyproject.toml for commands that must ignore user-level uv
# configuration. `tests/test_supply_chain.py` prevents the two copies from drifting.
# `sources` lives only in pyproject.toml; uv.toml rejects that field.
required-version = ">=0.9"
exclude-newer = "2026-06-30T00:00:00Z"

[exclude-newer-package]
flexdoc = "2099-12-31T00:00:00Z"
